services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - backend_uploads:/app/uploads
      - backend_db:/app/data
      - backup_data:/app/backups
      - ./backend/server.js:/app/server.js
      - ./backend/database.js:/app/database.js
      - ./backend/middleware:/app/middleware
      - ./backend/routes:/app/routes
      - ./backend/migrations:/app/migrations
    environment:
      - PORT=3001
      - DB_PATH=/app/data/crm.db
      - BACKUP_DIR=/app/backups
    restart: unless-stopped
    expose:
      - 3001

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/public:/app/public
      - ./frontend/vite.config.js:/app/vite.config.js
    ports:
      - 5173:5173
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      - VITE_API_URL=/api

  backup:
    build: ./backup
    volumes:
      - backend_db:/app/data
      - backup_data:/app/backups
    environment:
      - DB_SOURCE=/app/data/crm.db
      - BACKUP_DIR=/app/backups
      - BACKUP_INTERVAL=60
      - BACKUP_RETENTION=30
      - WEB_PORT=8080
      - TZ=America/Mexico_City
    restart: unless-stopped
    expose:
      - 8080
    depends_on:
      - backend

  dbmanager:
    build: ./nginx-dbmanager
    ports:
      - "9090:8080"
    environment:
      - NGINX_BASIC_AUTH_USER=${NGINX_BASIC_AUTH_USER:-admin}
      - NGINX_BASIC_AUTH_PASSWORD=${NGINX_BASIC_AUTH_PASSWORD:-admin123}
    depends_on:
      - backup
    restart: unless-stopped

volumes:
  backend_uploads:
  backend_db:
  backup_data:
