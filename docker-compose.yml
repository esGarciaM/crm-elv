services:
  backend:
    build: ./backend
    volumes:
      - backend_uploads:/app/uploads
      - backend_db:/app/data
    environment:
      - PORT=3001
      - DB_PATH=/app/data/crm.db
    restart: unless-stopped
    expose:
      - 3001
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/stats', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - 80

volumes:
  backend_uploads:
  backend_db:
